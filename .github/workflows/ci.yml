name: CI

# Push na main: valida o site, constroi a imagem e publica no GitHub
# Container Registry (ghcr.io/mond-day/frotec-lp).
# Pull request: valida e constroi a imagem, mas nao faz push — evita poluir
# o registry com builds de PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mond-day/frotec-lp

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Mesma versao usada na imagem de producao (ver Dockerfile).
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Build do Next.js
        run: npm run build

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: verificar
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push so na main (e no disparo manual). Em PR a imagem e construida
      # para validar o Dockerfile e descartada no fim do runner.
      # O build precisa de rede: o next/font baixa as fontes durante o build.
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
