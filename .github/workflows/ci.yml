name: CI

# Valida o site a cada push na main e em cada pull request.
# Nao publica nada: so garante que lint, tipos, build do Next e a imagem
# Docker continuam funcionando.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Mesma versao usada na imagem de producao (ver Dockerfile).
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Build do Next.js
        run: npm run build

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7

      # O runner ja vem com Docker instalado, entao nao precisa de action extra.
      # O build precisa de rede: o next/font baixa as fontes durante o build.
      - name: Build da imagem
        run: docker build -t frotec-lp:${{ github.sha }} .
