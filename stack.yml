# Stack Swarm para Portainer + Traefik.
#
# A imagem e publicada automaticamente pelo GitHub Actions em cada push na
# main (ghcr.io/mond-day/frotec-lp:latest e :sha). Nao e preciso construir
# nem fazer push na maquina local.
#
# O repositorio e privado, entao o pacote no GHCR tambem e privado. Os nos
# do swarm so puxam a imagem se o Portainer tiver um Docker Registry
# cadastrado para o GitHub:
#   URL:      ghcr.io
#   Username: seu usuario GitHub
#   Password: PAT com escopo read:packages
#             (token classico tambem precisa de repo se o pacote estiver
#             ligado a este repositorio privado)
#
# Passos:
#   1. Cadastre o registry GitHub no Portainer (Registries), se ainda nao
#      existir — veja o README, secao Deploy.
#   2. Portainer: Stacks > Add stack > cole este arquivo (ou aponte o Git).
#   3. Confira o dominio nas labels do Traefik.
#   4. Preencha as variaveis SMTP no ambiente da stack (ver .env.example).
#
# latest e mutavel: cada push na main a substitui. Para pin de versao,
# troque a tag abaixo pelo SHA completo do commit publicado
# (ghcr.io/mond-day/frotec-lp:<sha>).
#
# A rede traefik-public precisa existir (overlay) e o Traefik ja precisa
# estar nela. Este arquivo nao cria o Traefik.

version: "3.8"

services:
  frotec-lp:
    image: ghcr.io/mond-day/frotec-lp:latest
    environment:
      # Servidor de e-mail que envia os leads ao comercial. Lidas em runtime pela
      # rota /api/lead, entao trocar o valor aqui e redeployar basta — nao precisa
      # reconstruir a imagem.
      #
      # SMTP_PASS fica visivel em texto para quem abre a stack no Portainer. Se
      # isso for um problema, o proximo passo e um Docker secret montado em
      # arquivo, o que exige adaptar lerConfigSmtp em lib/email.ts para ler o
      # conteudo do arquivo apontado por uma variavel SMTP_PASS_FILE.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO}
      LEAD_EMAIL_FROM: ${LEAD_EMAIL_FROM}
    networks:
      - traefik-public
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.frotec-lp.rule=Host(`frotec.sondercorp.com.br`)
        - traefik.http.routers.frotec-lp.entrypoints=websecure
        - traefik.http.routers.frotec-lp.tls=true
        - traefik.http.routers.frotec-lp.tls.certresolver=letsencrypt
        - traefik.http.services.frotec-lp.loadbalancer.server.port=3000

networks:
  traefik-public:
    external: true
