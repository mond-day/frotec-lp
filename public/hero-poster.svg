<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1c2738"/>
      <stop offset="42%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="riskGlow" cx="18%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#f0a93c" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f0a93c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f0a93c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="controlGlow" cx="82%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#10E1B1" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#2D8CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10E1B1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a93c" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#f0a93c" stop-opacity="0.05"/>
      <stop offset="65%" stop-color="#10E1B1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2D8CFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="roadWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a93c" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#f0a93c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="35%" stop-color="#10E1B1" stop-opacity="0"/>
      <stop offset="70%" stop-color="#10E1B1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D8CFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151820" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#riskGlow)"/>
  <rect width="1920" height="1080" fill="url(#controlGlow)"/>
  <!-- Horizon light band -->
  <rect y="560" width="1920" height="2" fill="url(#horizon)" opacity="0.55"/>
  <!-- Ground plane -->
  <path d="M0 620 Q480 580 960 560 T1920 540 L1920 1080 L0 1080Z" fill="url(#ground)"/>
  <!-- Corridor / route lines (abstract, no illustration) -->
  <path d="M-80 760 C400 740 820 700 1200 660 S1800 620 2100 600" stroke="url(#roadWarm)" stroke-width="3" fill="none"/>
  <path d="M-80 790 C420 770 840 730 1220 690 S1820 650 2100 630" stroke="url(#roadCool)" stroke-width="2.5" fill="none"/>
  <path d="M-80 830 C440 810 860 770 1240 730 S1840 690 2100 670" stroke="url(#roadCool)" stroke-width="1.5" fill="none" opacity="0.45"/>
  <!-- Soft vignette -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.15"/>
</svg>
